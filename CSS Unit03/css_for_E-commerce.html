<!DOCTYPE html>
<html>
<head>
    <title>Responsive E-commerce Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar container */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2874f0;
            padding: 10px 20px;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        /* Menu */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Icons */
        .icons {
            display: flex;
            gap: 15px;
            color: white;
            font-size: 16px;
        }

        /* Mobile menu button */
        .menu-btn {
            display: none;
            font-size: 22px;
            color: white;
            cursor: pointer;
        }

        /* Responsive (Mobile View) */
        @media (max-width: 768px) {

            .nav-links {
                display: none;
                flex-direction: column;
                background-color: #2874f0;
                position: absolute;
                top: 55px;
                left: 0;
                width: 100%;
                padding: 10px 0;
                text-align: center;
            }

            .nav-links a {
                padding: 10px 0;
            }

            .menu-btn {
                display: block;
            }

            .navbar.active .nav-links {
                display: flex;
            }
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div class="navbar" id="navbar">

    <div class="logo">ShopEasy</div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Offers</a>
        <a href="#">Contact</a>
    </div>

    <div class="icons">
        <span>🛒</span>
        <span>👤</span>
    </div>

</div>

<!-- JavaScript for toggle -->
<script>
    function toggleMenu() {
        document.getElementById("navbar").classList.toggle("active");
    }
</script>

</body>
</html>
