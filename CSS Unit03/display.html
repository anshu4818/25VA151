<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css display</title>
    <style>
        body{
            margin: 0;
            padding: 0;

        }
        html,*{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        main{
            width: 900px;
            height: 700px;
            background-color: coral;
            margin: 0;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px ;


        }
        .box{
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            margin: 0px;


        }
            
        
        
    </style>
</head>
<body>
    <main>
    <div class="box ">1</div>
    <div class="box ">2</div>
    <div class="box ">3</div>
    <div class="box ">4</div>
    <div class="box ">5</div>
    </main>
    
    
</body>
</html>
